# Load video support modules first
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod gfxterm

# Set graphics mode — try 800x600x32, fallback to any 32-bit mode
if [ x"$grub_platform" = x"efi" ]; then
    insmod gfxterm_background
fi

set gfxmode=800x600x32,1024x768x32,auto
set gfxpayload=keep
terminal_output gfxterm

set timeout=0
set default=0

menuentry "MyOs" {
    multiboot /boot/kernel.elf
    boot
}
