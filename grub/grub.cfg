# Set graphics mode BEFORE the menuentry so GRUB passes
# Multiboot framebuffer info (flag bit 12) to the kernel.
# Without these lines the kernel sees flags without bit 12
# and graphics_init() falls through to the "no framebuffer" path.
set gfxmode=800x600x32
set gfxpayload=keep
terminal_output gfxterm

set timeout=0
set default=0

menuentry "MyOs" {
    multiboot /boot/kernel.elf
    boot
}
